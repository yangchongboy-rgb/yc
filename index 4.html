    function profileFor(index) {
      if (profiles[language]) return profiles[language][index];
      const p = compactProfiles[language]["good"][index], g = compactProfiles[language]["learn"][index], f = compactProfiles[language]["path"][index], name = names[language][index];

        fr:{read:`${name} avance avec ${p}. C’est cette énergie singulière qui peut vous aider à trouver votre juste place.`,good:`Votre force : ${p}.`,learn:`À cultiver : ${g}.`,path:`Votre chemin s’éclaire lorsque vous choisissez ${f}.`},

        de:{read:`Als ${name} bringst du ${p} mit. Diese eigene Energie hilft dir, deinen hellsten Platz zu finden.`,good:`Deine Stärke: ${p}.`,learn:`Zum Üben: ${g}.`,path:`Dein Weg wird heller, wenn du ${f} wählst.`}
      }[language];
      return {...copy,tag:[p,g,f]};
    }
    let language = (navigator.languages || [navigator.language || "en"]).map(x => x.slice(0,2)).find(x => ui[x]) || "en";
    let lastIndex = null;
    const $ = id => document.getElementById(id);
    function signIndex(month, day) { let current = 9; for (const [m,d,index] of starts) if (month > m || (month === m && day >= d)) current = index; return current; }
    function translate() {
      const t = ui[language]; document.documentElement.lang = language; document.title = `${t.brand} · Zodiac Notes`;
      $("brand").textContent=t.brand; $("headline").innerHTML=t.headline; $("intro").textContent=t.intro; $("birthday-label").textContent=t.date; $("submit").textContent=t.button; $("strength-title").textContent=t.strength; $("growth-title").textContent=t.growth; $("path-title").textContent=t.path; $("notice").textContent=t.notice; $("footer").textContent=t.footer; $("language").value=language;
      $("sign-grid").innerHTML=signs.map((symbol,i)=>`<div class="sign"><span class="sign-symbol">${symbol}</span><div class="sign-name">${names[language][i]}</div><div class="sign-date">${ranges[language][i]}</div></div>`).join("");
      if(lastIndex !== null) showResult(lastIndex, false);
    }
    function showResult(index, scroll=true) {
      const t=ui[language], p=profileFor(index), focal=focus[language]?.[index] || `${names[language][index]} · ${ranges[language][index]}`; lastIndex=index; $("symbol").textContent=signs[index]; $("range").textContent=ranges[language][index]; $("sign-name").textContent=names[language][index]; $("kicker").textContent=focal; $("reading").textContent=p.read; $("strength").textContent=p.good; $("growth").textContent=p.learn; $("path").textContent=p.path; $("tags").innerHTML=p.tag.map(x=>`<span class="tag">${x}</span>`).join(""); $("result").hidden=false; if(scroll) $("result").scrollIntoView({behavior:"smooth",block:"start"});
    }
    $("form").addEventListener("submit", event => { event.preventDefault(); const value=$("birthday").value; if(!value) { $("error").textContent=ui[language].error; return; } const parts=value.split("-").map(Number); if(parts.length!==3 || parts.some(Number.isNaN)) { $("error").textContent=ui[language].error; return; } $("error").textContent=""; showResult(signIndex(parts[1],parts[2])); });
    $("language").addEventListener("change", event => { language=event.target.value; translate(); });
    translate();
  })();
