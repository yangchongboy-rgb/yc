    $("form").addEventListener("submit", event => { event.preventDefault(); const value=$("birthday").value; if(!value) { $("error").textContent=ui[language].error; return; } const parts=value.split("-").map(Number); if(parts.length!==3 || parts.some(Number.isNaN)) { $("error").textContent=ui[language].error; return; } $("error").textContent=""; showResult(signIndex(parts[1],parts[2])); });
    $("language").addEventListener("change", event => { language=event.target.value; translate(); });
    translate();
  })();
  </script>
</body>
</html>
